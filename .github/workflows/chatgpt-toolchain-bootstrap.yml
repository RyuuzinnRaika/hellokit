name: ChatGPT Android Build Tools 34 Bootstrap

on:
  push:
    branches:
      - chatgpt-toolchain-bootstrap-20261007

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Package Build Tools 34
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p out
          tar -C "$ANDROID_HOME" -czf out/android-build-tools-34.0.0.tar.gz build-tools/34.0.0
          sha256sum out/android-build-tools-34.0.0.tar.gz > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: inkbridge-build-tools-34
          path: out/*
          retention-days: 1
          compression-level: 0

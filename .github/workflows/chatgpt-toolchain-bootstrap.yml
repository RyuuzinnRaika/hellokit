name: ChatGPT Kotlin Cache Bootstrap

on:
  push:
    branches:
      - chatgpt-toolchain-bootstrap-20261007

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve Kotlin compile dependencies
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/inkbridge-bootstrap
          mkdir -p /tmp/inkbridge-bootstrap/app/src/main/java/dev/bootstrap
          mkdir -p /tmp/inkbridge-bootstrap/app/src/main/res/values
          cat > /tmp/inkbridge-bootstrap/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "InkBridgeBootstrap"
          include(":app")
          EOF
          cat > /tmp/inkbridge-bootstrap/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > /tmp/inkbridge-bootstrap/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > /tmp/inkbridge-bootstrap/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "dev.bootstrap"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.bootstrap"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("androidx.camera:camera-core:1.4.2")
              implementation("androidx.camera:camera-camera2:1.4.2")
              implementation("androidx.camera:camera-lifecycle:1.4.2")
              implementation("androidx.camera:camera-view:1.4.2")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")
              implementation("com.tom-roush:pdfbox-android:2.0.27.0")
          }
          EOF
          cat > /tmp/inkbridge-bootstrap/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" />
          </manifest>
          EOF
          cat > /tmp/inkbridge-bootstrap/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          cat > /tmp/inkbridge-bootstrap/app/src/main/java/dev/bootstrap/Bootstrap.kt <<'EOF'
          package dev.bootstrap
          class Bootstrap {
              fun value(): String = "InkBridge"
          }
          EOF
          cd /tmp/inkbridge-bootstrap
          gradle --no-daemon :app:assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Pack Gradle module cache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-build-tools-impl/2.0.21"
          tar -C "$HOME/.gradle/caches" -czf out/gradle-modules-2-kotlin.tar.gz modules-2
          sha256sum out/gradle-modules-2-kotlin.tar.gz > out/SHA256.txt
          du -h out/*
      - uses: actions/upload-artifact@v4
        with:
          name: inkbridge-kotlin-gradle-cache
          path: out/*
          retention-days: 1
          compression-level: 0
